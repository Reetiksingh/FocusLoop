server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 40
            redis-rate-limiter.burstCapacity: 80
            key-resolver: "#{@userKeyResolver}"
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
        - id: focus-session-service
          uri: ${SESSION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/sessions/**,/api/v1/rooms/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/analytics/**,/api/v1/achievements/**
        - id: leaderboard-service
          uri: ${LEADERBOARD_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/leaderboards/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/notifications/**,/ws/notifications/**

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: gateway
