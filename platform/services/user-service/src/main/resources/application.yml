server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: user-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/focusloop}
    username: ${POSTGRES_USER:focusloop}
    password: ${POSTGRES_PASSWORD:focusloop}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: user-service
