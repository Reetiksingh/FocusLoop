name: focusloop-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: focusloop
      POSTGRES_PASSWORD: focusloop
      POSTGRES_DB: focusloop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusloop -d focusloop"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      JWT_ISSUER: focusloop
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      SESSION_SERVICE_URL: http://focus-session-service:8083
      ANALYTICS_SERVICE_URL: http://analytics-service:8084
      LEADERBOARD_SERVICE_URL: http://leaderboard-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      REDIS_HOST: redis
    depends_on:
      - redis

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      POSTGRES_URL: jdbc:postgresql://postgres:5432/focusloop
      POSTGRES_USER: focusloop
      POSTGRES_PASSWORD: focusloop
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    depends_on:
      - postgres

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      POSTGRES_URL: jdbc:postgresql://postgres:5432/focusloop
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  focus-session-service:
    build:
      context: .
      dockerfile: services/focus-session-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      POSTGRES_URL: jdbc:postgresql://postgres:5432/focusloop
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      - postgres
      - kafka
      - redis

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      SERVER_PORT: 8084
      POSTGRES_URL: jdbc:postgresql://postgres:5432/focusloop
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    depends_on:
      - postgres
      - kafka
      - redis

  leaderboard-service:
    build:
      context: .
      dockerfile: services/leaderboard-service/Dockerfile
    environment:
      SERVER_PORT: 8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    depends_on:
      - kafka
      - redis

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      SERVER_PORT: 8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    depends_on:
      - kafka
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: focusloop
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres-data:
  redis-data:
