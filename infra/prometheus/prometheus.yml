global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "auth-service:8081"
          - "user-service:8082"
          - "focus-session-service:8083"
          - "analytics-service:8084"
          - "leaderboard-service:8085"
          - "notification-service:8086"
