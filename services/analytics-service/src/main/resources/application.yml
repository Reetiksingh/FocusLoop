server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: analytics-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/focusloop}
    username: ${POSTGRES_USER:focusloop}
    password: ${POSTGRES_PASSWORD:focusloop}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      properties:
        spring.json.trusted.packages: com.focusloop.shared.events
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: analytics-service
